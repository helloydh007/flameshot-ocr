# AppImage CI：打 tag（v*）或手动触发时，在 Docker 内构建 AppImage。
# tag 推送 → 自动创建/更新 GitHub Release 并附上产物。
name: AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe 需要完整历史与 tag

      - name: Build AppImage in Docker
        run: |
          docker build -t flameshot-ocr-builder packaging/appimage
          docker run --rm -v "$PWD":/work flameshot-ocr-builder

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
